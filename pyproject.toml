[project]
name = "cs-command-center-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.9.0",
    "google-cloud-bigquery>=3.25.0",
    "anthropic>=0.40.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27", "uvicorn>=0.30"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
